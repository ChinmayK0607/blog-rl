# Deliberately narrow 60-update learnability run. The controller horizon is
# declared by staged_curriculum_v5_communication_overfit_60.json.
max_concurrent_runs = 4
atomic_multi_run_updates = true

[model]
name = "/workspace/models/qwen3-1.7b-70d244c"
seq_len = 2560
attn = "flash_attention_2"
impl = "hf"
fused_lm_head_token_chunk_size = "disabled"

[model.lora]
rank = 16
alpha = 32
dropout = 0.0
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj"]
initial_adapter_path = "/workspace/artifacts/warmstart-1.7b-step320"
initial_adapter_sha256 = "2dc1694c35a414cef254273f6daf3a4ea1e611856c9d0c3d815eec60428f949b"

[loss]
type = "default"
adv_tau = 1.0
kl_tau = 0.001
dppo_mask_low = 0.1
dppo_mask_high = 0.1

[optim]
type = "adamw"
lr = 0.0000075
max_norm = 1.0

[weight_broadcast]
type = "filesystem"
save_sharded = false
save_format = "safetensors"

[ckpt]
interval = 10
keep_last = 2
keep_interval = 10
weights_only = true

[ckpt.weights]
save_sharded = false
save_format = "safetensors"
save_adapter_separately = true

[rollout_parity_gate]
# vLLM FA2 and the HF/FA2 trainer can disagree most on highly peaked,
# dynamically constrained choices even when their exact adapter hashes match.
# These remain hard bounds for the measured RTX 5090 backend envelope.
max_mean_logprob_error = 0.10
probability_tail_threshold = 0.05
max_mean_mismatch_kl = 0.05

[log]
level = "info"
interval = 10

[wandb]
project = "swarm-arena-rl"
name = "qwen3-1.7b-communication-overfit-60-trainer"
group = "qwen3-1.7b-communication-overfit-60"
tags = ["1.7b", "lora", "marl", "focused-credit", "receiver", "communication-overfit", "four-policy"]
offline = true
