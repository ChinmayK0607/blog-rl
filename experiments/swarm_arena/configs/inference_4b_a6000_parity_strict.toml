enable_lora = true
max_loras = 8
max_cpu_loras = 16
max_lora_rank = 32
gpu_memory_utilization = 0.82

[model]
name = "/workspace/models/qwen3-4b-cdbee75f"
max_model_len = 4096
enforce_eager = true

[server]
host = "127.0.0.1"
port = 8000

[log]
level = "info"

# Keep the serving path deterministic enough for the trainer's unchanged
# constrained-policy parity gate. Production-like concurrent certification is
# required before optimizer work.
[vllm_extra]
generation_config = "vllm"
async_scheduling = false
max_num_seqs = 4

[vllm_extra.ir_op_priority]
rms_norm = ["native"]
fused_add_rms_norm = ["native"]
