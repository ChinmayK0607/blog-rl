# Prime counts token-packing slices internally; the controller owns the finite
# logical update horizon.
max_concurrent_runs = 4

[model]
name = "/workspace/models/qwen3-1.7b-70d244c"
seq_len = 2560
attn = "flash_attention_2"
impl = "hf"
fused_lm_head_token_chunk_size = "disabled"

[model.lora]
rank = 16
alpha = 32
dropout = 0.0
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj"]
initial_adapter_path = "/workspace/artifacts/warmstart-1.7b-step320"
initial_adapter_sha256 = "2dc1694c35a414cef254273f6daf3a4ea1e611856c9d0c3d815eec60428f949b"

[loss]
type = "default"
adv_tau = 1.0
kl_tau = 0.001
dppo_mask_low = 0.1
dppo_mask_high = 0.1

[optim]
type = "adamw"
lr = 0.000005
max_norm = 1.0

[weight_broadcast]
type = "filesystem"
save_sharded = false
save_format = "safetensors"

# V4 uses a separately calibrated optimized actor plus bounded off-policy
# admission. These are prospective limits, not a relabeling of rejected v1.
[rollout_parity_gate]
max_mean_logprob_error = 0.01
max_p99_logprob_error = 0.15
max_probability_error = 0.16
max_p99_probability_error = 0.07
probability_tail_threshold = 0.05
max_probability_tail_fraction = 0.02
max_mean_mismatch_kl = 0.001
max_mismatch_kl = 0.13

[log]
level = "info"
interval = 10
