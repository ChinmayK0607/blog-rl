enable_lora = true
max_loras = 8
max_cpu_loras = 16
max_lora_rank = 16
gpu_memory_utilization = 0.82
enable_prefix_caching = false

[model]
name = "/workspace/models/qwen3-1.7b-70d244c"
max_model_len = 4096
enforce_eager = true

[server]
host = "127.0.0.1"
port = 8000

[log]
level = "info"

# Correctness-first bootstrap: remove server generation defaults and the
# scheduling/batching paths that can change decode numerics. Throughput knobs
# may only be restored one at a time behind the unchanged parity gate.
[vllm_extra]
generation_config = "vllm"
async_scheduling = false
enable_chunked_prefill = false
max_num_seqs = 1

[vllm_extra.ir_op_priority]
rms_norm = ["native"]
fused_add_rms_norm = ["native"]
