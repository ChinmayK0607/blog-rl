[project]
name = "symbolic-tool-calling-v1"
version = "0.1.0"
description = "Deterministic long-horizon symbolic tool-calling benchmark."
requires-python = ">=3.12,<3.13"
dependencies = ["verifiers"]

[project.scripts]
symbolic-benchmark = "symbolic_tool_calling_v1.pipeline:main"
symbolic-training-examples = "symbolic_tool_calling_v1.training:main"
symbolic-pass-at-k = "symbolic_tool_calling_v1.pass_at_k:main"
symbolic-curate = "symbolic_tool_calling_v1.curation:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["symbolic_tool_calling_v1"]
