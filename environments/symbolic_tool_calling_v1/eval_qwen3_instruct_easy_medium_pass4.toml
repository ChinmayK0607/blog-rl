max_turns = 24
max_total_tokens = 32768
model = "Qwen/Qwen3-4B-Instruct-2507"
num_tasks = 800
num_rollouts = 4
max_concurrent = 48
rich = false

[taskset]
id = "symbolic-tool-calling-v1"
num_tasks = 800
seed = 4001
branching_factor = 2

[[taskset.conditions]]
horizon_bucket = "short"
distractor_ratio = 0.0
recovery_cost = 2
verbosity_setting = "low"
imbalance_setting = "low"

[[taskset.conditions]]
horizon_bucket = "medium"
distractor_ratio = 0.5
recovery_cost = 3
verbosity_setting = "high"
imbalance_setting = "high"

[taskset.tools]
colocated = true

[harness]
id = "default"

[client]
base_url = "http://localhost:8032/v1"
api_key_var = "EMPTY"

[sampling]
max_tokens = 4096
temperature = 0.7
